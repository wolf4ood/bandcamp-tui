[package]
name = "bandcamp-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal client for bandcamp.com"
license = "MIT"
repository = "https://github.com/wolf4ood/bandcamp-tui"
readme = "README.md"
keywords = ["bandcamp", "tui", "music", "player", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
keyring = "4"
open = "5.4.4"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "cookies", "rustls", "stream", "gzip", "brotli", "http2", "query", "charset"] }
rodio = { version = "0.22", default-features = false, features = ["symphonia-mp3", "playback"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stream-download = { version = "0.24", default-features = false, features = ["reqwest-rustls", "temp-storage"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-input = "0.15.4"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
